name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/nodes/MarkdownToPdf/MarkdownToPdf.node.js
          test -f dist/nodes/MarkdownToPdf/MarkdownToPdf.node.json
          test -f dist/nodes/MarkdownToPdf/markdownToPdf.svg
